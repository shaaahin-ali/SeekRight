services:
  - type: web
    name: seekright-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: ./render_build.sh
    startCommand: export PATH="$PATH:$(pwd)/ffmpeg_bin" && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: MISTRAL_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: HF_TOKEN
        sync: false
