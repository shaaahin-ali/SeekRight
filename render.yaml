services:
  - type: web
    name: seekright-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -U pip && pip install "setuptools<70" wheel && pip install --no-build-isolation -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    systemPackages:
      - ffmpeg
    envVars:
      - key: MISTRAL_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: HF_TOKEN
        sync: false          # Optional: add for higher HF API limits
      - key: PYTHON_VERSION
        value: 3.11.0
