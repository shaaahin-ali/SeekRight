services:
  - type: web
    name: seekright-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -U pip setuptools wheel && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    systemPackages:
      - ffmpeg
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: MISTRAL_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: HF_TOKEN
        sync: false
