services:
  - type: web
    name: seekright-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MISTRAL_API_KEY
        sync: false          # set this manually in Render dashboard
      - key: FRONTEND_URL
        sync: false          # set to your Vercel URL, e.g. https://seekright.vercel.app
      - key: PYTHON_VERSION
        value: 3.11.0
